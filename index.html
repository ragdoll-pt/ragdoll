<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>3D Тряпичная Кукла — Физика</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }
    body {
      overflow: hidden;
      font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a1a;
      position: fixed;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #info {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 12px;
      right: 12px;
      color: white;
      background: rgba(20, 20, 40, 0.65);
      padding: 10px 16px;
      border-radius: 22px;
      pointer-events: none;
      z-index: 100;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: clamp(12px, 3.5vw, 14px);
      text-align: center;
      max-width: 640px;
      margin: 0 auto;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      line-height: 1.4;
    }
    #controls {
      position: absolute;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      left: 12px;
      right: 12px;
      color: #b0b8d0;
      font-size: clamp(11px, 3vw, 12px);
      background: rgba(10, 10, 25, 0.7);
      padding: 8px 16px;
      border-radius: 18px;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      line-height: 1.5;
    }
    @media (max-width: 600px) {
      #info { top: calc(8px + env(safe-area-inset-top, 0px)); left: 8px; right: 8px; padding: 9px 12px; border-radius: 16px; }
      #controls { bottom: calc(8px + env(safe-area-inset-bottom, 0px)); left: 8px; right: 8px; padding: 8px 10px; border-radius: 14px; }
    }
    .highlight {
      color: #ffddaa;
      font-weight: 600;
    }
    #snowToggle {
      position: absolute; z-index: 120; top: calc(74px + env(safe-area-inset-top, 0px)); right: 12px;
      border: 1px solid rgba(255,255,255,.22); border-radius: 16px; padding: 11px 15px;
      background: rgba(24,34,55,.86); color: #f4f8ff; font: 600 14px -apple-system, sans-serif;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    #snowToggle.active { background: rgba(126,180,235,.92); color: #102033; }
    #snowSettingsToggle {
      position:absolute; z-index:120; top:calc(122px + env(safe-area-inset-top, 0px)); right:12px;
      border:1px solid rgba(255,255,255,.22); border-radius:14px; padding:9px 13px;
      background:rgba(24,34,55,.86); color:#f4f8ff; font:600 13px -apple-system,sans-serif;
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    }
    #snowSettingsPanel {
      position:absolute; z-index:121; top:calc(166px + env(safe-area-inset-top, 0px)); right:12px;
      width:min(250px, calc(100vw - 24px)); box-sizing:border-box; padding:12px 14px;
      border:1px solid rgba(255,255,255,.2); border-radius:15px;
      background:rgba(15,22,38,.92); color:#f4f7ff; font:600 13px -apple-system,sans-serif;
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      display:none; flex-direction:column; gap:8px;
    }
    #snowSettingsPanel.open { display:flex; }
    #snowIntensity { width:100%; accent-color:#9bc9f4; }
    #snowIntensityValue { text-align:right; color:#cfe5ff; font-variant-numeric:tabular-nums; }
    #spawnButton {
      position:absolute; z-index:120; top:calc(74px + env(safe-area-inset-top, 0px)); left:12px;
      border:1px solid rgba(255,255,255,.22); border-radius:16px; padding:11px 15px;
      background:rgba(24,34,55,.86); color:#f4f8ff; font:600 14px -apple-system,sans-serif;
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    }
    @media (max-width:600px) { #spawnButton { top:calc(65px + env(safe-area-inset-top, 0px)); left:8px; padding:10px 12px; } }
    @media (max-width:600px) { #snowToggle { top: calc(65px + env(safe-area-inset-top, 0px)); right: 8px; padding: 10px 12px; } }
    @media (max-width:600px) {
      #snowSettingsToggle { top:calc(108px + env(safe-area-inset-top, 0px)); right:8px; padding:9px 11px; }
      #snowSettingsPanel { top:calc(150px + env(safe-area-inset-top, 0px)); right:8px; }
    }
    #armControl {
      position:absolute; z-index:125; top:calc(122px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%);
      width:min(330px, calc(100vw - 24px)); padding:10px 14px; border-radius:15px;
      color:#f4f7ff; background:rgba(15,22,38,.86); border:1px solid rgba(255,255,255,.2);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font:600 12px -apple-system,sans-serif;
      display:flex; flex-direction:column; gap:6px;
    }
    #armControl input { width:100%; accent-color:#f2c27b; }
    #armControl .armControlTop { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    @media (max-width:600px) { #armControl { top:calc(112px + env(safe-area-inset-top, 0px)); width:min(300px, calc(100vw - 20px)); padding:8px 11px; } }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #8899cc;
      font-size: 16px;
      z-index: 200;
      transition: opacity 0.5s;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading">Загрузка симулятора...</div>
  <div id="info">🧵 <span class="highlight">Тряпичная кукла</span> — тяни, кидай, мни</div>
  <button id="spawnButton" type="button">↩ На спавн</button>
  <button id="snowToggle" type="button" aria-pressed="false">❄️ Снег</button>
  <button id="snowSettingsToggle" type="button" aria-expanded="false">⚙️ Обильность снега</button>
  <div id="snowSettingsPanel" aria-label="Настройки снегопада">
    <label for="snowIntensity">Обильность снегопада</label>
    <input id="snowIntensity" type="range" min="10" max="100" step="10" value="40">
    <div id="snowIntensityValue">40%</div>
  </div>
  <div id="controls">
    <span class="highlight">Палец по кукле</span> — тянуть • <span class="highlight">1 палец по фону</span> — вращать камеру • <span class="highlight">2 пальца</span> — вращать / зум
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import * as CANNON from 'cannon-es';

    // Скрываем загрузку
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
    }, 600);

    // --- Настройка сцены ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);
    scene.fog = new THREE.Fog(0x0a0a1a, 12, 35);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4.5, 3.5, 7.5);
    camera.lookAt(0, 1.8, 0);

    function isMobileDevice() { return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1; }

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobileDevice() ? 1.15 : 1.6));
    // Mobile performance: avoid expensive shadow maps on phones.
    renderer.shadowMap.enabled = !isMobileDevice();
    renderer.shadowMap.type = THREE.BasicShadowMap; // максимально резкие тени
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // --- Управление камерой ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.8, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = isMobileDevice() ? 0.65 : 0.8;
    controls.zoomSpeed = isMobileDevice() ? 0.9 : 1.2;
    
    // КРИТИЧЕСКИ ВАЖНО: Отключаем панорамирование (движение камеры стрелками/зажатием), 
    // чтобы оно не перехватывало захват куклы
    controls.enablePan = false; 
    
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 3;
    controls.maxDistance = 16;

    // Настройка кнопок: ЛКМ теперь захватывает (PAN), ПКМ вращает
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.PAN, 
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT: THREE.MOUSE.ROTATE
    };
    // Тач: один палец не вращает, два — вращают
    controls.touches = {
      ONE: THREE.TOUCH.ROTATE,
      TWO: THREE.TOUCH.DOLLY_ROTATE
    };

    // --- Освещение ---
    const ambientLight = new THREE.AmbientLight(0x30354a, 0.72);
    scene.add(ambientLight);
    const hemisphereLight = new THREE.HemisphereLight(0x9db7ff, 0x17131e, 0.85);
    scene.add(hemisphereLight);

    const mainLight = new THREE.DirectionalLight(0xffe8c8, 1.35);
    mainLight.position.set(6, 12, 8);
    mainLight.castShadow = !isMobileDevice();
    mainLight.receiveShadow = true;
    mainLight.shadow.mapSize.width = isMobileDevice() ? 512 : 2048;
    mainLight.shadow.mapSize.height = isMobileDevice() ? 512 : 2048;
    mainLight.shadow.autoUpdate = true;
    mainLight.shadow.radius = 0; // без размытия
    mainLight.shadow.camera.near = 1;
    mainLight.shadow.camera.far = 30;
    const d = 5.5; // tighter shadow camera for higher detail
    mainLight.shadow.camera.left = -d;
    mainLight.shadow.camera.right = d;
    mainLight.shadow.camera.top = d;
    mainLight.shadow.camera.bottom = -d;
    mainLight.shadow.bias = -0.00015;
    mainLight.shadow.normalBias = 0.015;
    scene.add(mainLight);

    const fillLight = new THREE.PointLight(0x4477ff, 0.38);
    fillLight.position.set(-5, 3, -4);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0xffaa66, 0.32);
    rimLight.position.set(-3, 4, 7);
    scene.add(rimLight);

    // --- Физический мир ---
    const world = new CANNON.World();
    world.gravity.set(0, -16, 0);
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.solver.iterations = 18;
    world.solver.tolerance = 0.0005;
    world.defaultContactMaterial.friction = 0.4;
    world.defaultContactMaterial.restitution = 0.15;
    world.allowSleep = false;

    const groundMaterial = new CANNON.Material('ground');
    const bodyMaterial = new CANNON.Material('body');

    // Уютные фонари вокруг ринга: тёплый свет в зимних сумерках.
    const lampPosts=[];
    // Collision bodies for lamp posts (static cylinders), matching visible poles.
    const lampCollisionMat = new CANNON.Material('lampCollision');
    const lampCollisionContact = new CANNON.ContactMaterial(lampCollisionMat, bodyMaterial, {friction:0.55,restitution:0.05});
    world.addContactMaterial(lampCollisionContact);
    const lampMetal=new THREE.MeshStandardMaterial({color:0x202a35,metalness:0.72,roughness:0.3});
    const lampGlowMat=new THREE.MeshBasicMaterial({color:0xffd58a});
    const lampGlass=new THREE.MeshStandardMaterial({color:0xffe2a8,emissive:0xffb94d,emissiveIntensity:2.2,roughness:0.25});
    const lampPositions=[[-10.2,-10.2],[-10.2,0],[-10.2,10.2],[0,-10.2],[0,10.2],[10.2,-10.2],[10.2,0],[10.2,10.2]];
    for(const [lx,lz] of lampPositions){
      const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.11,4.7,10),lampMetal);pole.position.set(lx,2.35,lz);pole.castShadow=!isMobileDevice();scene.add(pole);
      const poleBody=new CANNON.Body({mass:0,material:lampCollisionMat});
      poleBody.addShape(new CANNON.Cylinder(0.11,0.075,4.7,10)); poleBody.position.set(lx,2.35,lz); world.addBody(poleBody);
      const arm=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.065,0.75,8),lampMetal);arm.rotation.z=Math.PI/2;arm.position.set(lx+(lx<0?0.32:-0.32),4.55,lz);scene.add(arm);
      const cap=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.18,0.32),lampMetal);cap.position.set(lx+(lx<0?0.58:-0.58),4.58,lz);scene.add(cap);
      const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.13,12,10),lampGlass);bulb.position.set(lx+(lx<0?0.58:-0.58),4.38,lz);scene.add(bulb);
      const halo=new THREE.Mesh(new THREE.SphereGeometry(0.34,12,8),new THREE.MeshBasicMaterial({color:0xffc76c,transparent:true,opacity:0.12}));halo.position.copy(bulb.position);scene.add(halo);
      const isCorner=(Math.abs(lx)===10.2 && Math.abs(lz)===10.2);
      const light=isCorner?new THREE.PointLight(0xffbd63,1.15,10,1.8):null;
      if(light){light.position.set(lx+(lx<0?0.58:-0.58),4.35,lz);light.castShadow=false;scene.add(light);}
      lampPosts.push({light,bulb,halo,phase:Math.random()*6});
    }
    // Decorative cables and Christmas string lights between posts. Lights only appear in snow mode.
    const cableMat=new THREE.MeshStandardMaterial({color:0x242b35,metalness:0.45,roughness:0.65});
    const cablePoints=[[-10.2,-10.2],[-10.2,0],[-10.2,10.2],[0,10.2],[10.2,10.2],[10.2,0],[10.2,-10.2],[0,-10.2],[-10.2,-10.2]];
    const cableGroup=new THREE.Group();scene.add(cableGroup);
    const festoonGroup=new THREE.Group();scene.add(festoonGroup);festoonGroup.visible=false;
    const festoonBulbs=[];
    for(let ci=0;ci<cablePoints.length-1;ci++){
      const a=cablePoints[ci],b=cablePoints[ci+1];
      const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(a[0],5.15,a[1]),new THREE.Vector3((a[0]+b[0])/2,4.92,(a[1]+b[1])/2),new THREE.Vector3(b[0],5.15,b[1])]);
      cableGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve,18,0.025,5,false),cableMat));
      for(let bi=1;bi<=5;bi++){
        const t=bi/6; const p=curve.getPoint(t); p.y-=0.08;
        const bulbColors=[0xff3355,0x35ff75,0x3388ff,0xffdd33,0xff55dd,0x33ffff];
        const color=bulbColors[(ci*5+bi)%bulbColors.length];
        const bulbMat=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:2.1,roughness:0.3});
        const bulbMesh=new THREE.Mesh(new THREE.SphereGeometry(0.095,8,6),bulbMat);bulbMesh.position.copy(p);festoonGroup.add(bulbMesh);
        const haloMesh=new THREE.Mesh(new THREE.SphereGeometry(0.19,6,5),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.18}));haloMesh.position.copy(p);festoonGroup.add(haloMesh);
        // Bulbs use emissive materials and halos instead of dozens of costly point lights.
        festoonBulbs.push({bulbMesh,haloMesh,phase:Math.random()*6});
      }
    }
    // Soft blue winter dusk ambience.
    scene.background=new THREE.Color(0x101b2c);scene.fog=new THREE.Fog(0x101b2c,14,42);

    const bottomLight = new THREE.PointLight(0x6688ff, 0.3);
    bottomLight.position.set(0, -1, 2);
    scene.add(bottomLight);



    const contactGroundBody = new CANNON.ContactMaterial(groundMaterial, bodyMaterial, {
      friction: 0.75,
      restitution: 0.02,
      contactEquationStiffness: 1e8,
      contactEquationRelaxation: 3
    });
    world.addContactMaterial(contactGroundBody);

    const contactBodyBody = new CANNON.ContactMaterial(bodyMaterial, bodyMaterial, {
      friction: 0.4,
      restitution: 0.1,
      contactEquationStiffness: 1e7,
      contactEquationRelaxation: 4
    });
    world.addContactMaterial(contactBodyBody);

    // --- Земля ---
    const groundGeometry = new THREE.PlaneGeometry(18, 18, 48, 48);
    // Разметка рисуется в прозрачной Canvas-текстуре и становится частью поверхности настила.
    // Координаты текстуры соответствуют мировой плоскости ринга (18 x 18).
    const ringTextureCanvas = document.createElement('canvas');
    ringTextureCanvas.width = 2048; ringTextureCanvas.height = 2048;
    const ringTextureCtx = ringTextureCanvas.getContext('2d');
    const markX = x => (x + 9) / 18 * ringTextureCanvas.width;
    const markY = z => (9 - z) / 18 * ringTextureCanvas.height;
    // Opaque white base: the material color tints the whole cushion, while markings stay in the same texture.
    ringTextureCtx.fillStyle = '#ffffff';
    ringTextureCtx.fillRect(0, 0, ringTextureCanvas.width, ringTextureCanvas.height);
    ringTextureCtx.lineCap = 'round'; ringTextureCtx.lineJoin = 'round';
    function textureLine(points, color, width=9, closed=false) {
      if (!points.length) return;
      ringTextureCtx.beginPath();
      ringTextureCtx.moveTo(markX(points[0][0]), markY(points[0][1]));
      for (let i=1;i<points.length;i++) ringTextureCtx.lineTo(markX(points[i][0]), markY(points[i][1]));
      if (closed) ringTextureCtx.closePath();
      ringTextureCtx.strokeStyle = color; ringTextureCtx.lineWidth = width;
      ringTextureCtx.stroke();
    }
    const textureEdge = 6.25;
    textureLine([[-textureEdge,-textureEdge],[textureEdge,-textureEdge],[textureEdge,textureEdge],[-textureEdge,textureEdge]], '#ff35d3', 11, true);
    ringTextureCtx.beginPath();
    ringTextureCtx.arc(markX(0), markY(0), 0.92/18*ringTextureCanvas.width, 0, Math.PI*2);
    ringTextureCtx.strokeStyle = '#ffe600'; ringTextureCtx.lineWidth = 10; ringTextureCtx.stroke();
    for (const [cx,cz,col] of [[-5.82,-5.82,'#ff304f'],[5.82,5.82,'#ff304f'],[-5.82,5.82,'#20d9ff'],[5.82,-5.82,'#20d9ff']]) {
      const h=.32;
      textureLine([[cx-h,cz-h],[cx+h,cz-h],[cx+h,cz+h],[cx-h,cz+h]], col, 10, true);
    }
    const ringMarkTexture = new THREE.CanvasTexture(ringTextureCanvas);
    ringMarkTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    ringMarkTexture.colorSpace = THREE.SRGBColorSpace || THREE.sRGBEncoding;
    ringMarkTexture.needsUpdate = true;
    const groundMaterialVisual = new THREE.MeshStandardMaterial({
      color: 0xb51628, map: ringMarkTexture, transparent: false,
      roughness: 0.52, metalness: 0.16, side: THREE.DoubleSide
    });
    const groundMesh = new THREE.Mesh(groundGeometry, groundMaterialVisual);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.receiveShadow = true;
    groundMesh.position.y = 0.28; // единая мягкая красная подушка ринга
    scene.add(groundMesh);
    // Непрерывный тонкий снежный покров — остаётся даже после перемещения отдельных сугробов.
    const snowBlanketGeo = new THREE.PlaneGeometry(17.7, 17.7, 32, 32);
    const blanketPos = snowBlanketGeo.attributes.position;
    for (let i=0;i<blanketPos.count;i++) {
      const x=blanketPos.getX(i), z=blanketPos.getY(i);
      blanketPos.setZ(i, 0.012*Math.sin(x*1.7+z*0.6)*Math.cos(z*1.3-x*0.4));
    }
    snowBlanketGeo.computeVertexNormals();
    const snowBlanket = new THREE.Mesh(snowBlanketGeo, new THREE.MeshStandardMaterial({color:0xeaf4ff, map:ringMarkTexture, transparent:false, roughness:0.96, metalness:0, side:THREE.DoubleSide}));
    snowBlanket.rotation.x=-Math.PI/2; snowBlanket.position.y=0.305; snowBlanket.receiveShadow=true; snowBlanket.visible=false; scene.add(snowBlanket);
    const matVerts = groundGeometry.attributes.position;
    const matBase = Float32Array.from(matVerts.array);
    const matDent = new Float32Array(matVerts.count);
    // Мягкая подушка: нагрузка от частей куклы вызывает заметный прогиб.
    function updateMatDeformation(dt) {
      for (let v=0; v<matVerts.count; v++) {
        const wx=matBase[v*3], wz=-matBase[v*3+1];
        let pressure=0;
        for (let b=0;b<bodies.length;b++) {
          const body=bodies[b], shape=body.shapes[0];
          let halfY=0.42;
          if (shape instanceof CANNON.Sphere) halfY=shape.radius;
          else if (shape instanceof CANNON.Box) {
            const q=body.quaternion, e=shape.halfExtents;
            halfY=Math.abs(q.x*2*q.y)*e.x + Math.abs(1-2*q.y*q.y)*e.y + Math.abs(q.z*2*q.y)*e.z;
          }
          const bottom=body.position.y-halfY;
          // Bodies supported by the hidden safety base are still counted as pressing the cushion.
          if(bottom > 0.42 || bottom < -0.02) continue;
          const dx=wx-body.position.x, dz=wz-body.position.z;
          const radius=(b<3?1.45:1.05), dist=Math.hypot(dx,dz);
          if(dist>=radius) continue;
          const footprint=Math.pow(1-dist/radius,1.45);
          const weight=Math.min(1.35,body.mass/1.7);
          const impact=Math.min(0.7,Math.max(0,-body.velocity.y)*0.055);
          // Дополнительное, но умеренное сжатие только при активном вдавливании куклы.

      // Если лежит/падает — физика остаётся полностью свободной.
      if (!draggedBody) {
        const now = performance.now() / 1000;
        const up = new CANNON.Vec3(0, 1, 0);
        const torsoUp = new CANNON.Vec3(0, 1, 0);
        torso.body.quaternion.vmult(torsoUp, torsoUp);
        const standing = torsoUp.y > 0.78 && pelvis.body.position.y > 1.25;
        const startupStabilize = now < 3.2 && torsoUp.y > 0.65 && pelvis.body.position.y > 1.2;
        if (standing || startupStabilize) {
          // Стабилизация стоящей позы и короткий стартовый период, чтобы кукла не падала сразу.
          const stabilizeUpright = (body, strength, damping) => {
            const bodyUp = new CANNON.Vec3(0, 1, 0);
            body.quaternion.vmult(bodyUp, bodyUp);
            bodyUp.cross(up, idleTorque);
            idleTorque.scale(strength * Math.max(0, 1 - bodyUp.dot(up)));
            const damp = body.angularVelocity.scale(-damping);
            body.applyTorque(idleTorque.vadd(damp));
          };
          const boost = startupStabilize ? 1.7 : 1.0;
          stabilizeUpright(torso.body, 150 * boost, 24 * boost);
          stabilizeUpright(pelvis.body, 115 * boost, 21 * boost);
          stabilizeUpright(lUpperLeg.body, 42 * boost, 10 * boost);
          stabilizeUpright(rUpperLeg.body, 42 * boost, 10 * boost);
          stabilizeUpright(lLowerLeg.body, 30 * boost, 7 * boost);
          stabilizeUpright(rLowerLeg.body, 30 * boost, 7 * boost);
          // Руки остаются свободными физическими сегментами; стабилизатор не фиксирует их позу.
        }
      }

      // Шаг физики
      world.step(1/60, delta, 4);
      updateRopes(delta);
      
      // Обновляем меши
      for (let i = 0; i < bodies.length; i++) {
        meshes[i].position.copy(bodies[i].position);
        meshes[i].quaternion.copy(bodies[i].quaternion);
      }
      
      // Обновляем камеру
      controls.update();
      
      // Едва заметное мерцание тёплых фонарей в зимних сумерках.
      const lampTime=performance.now()*0.001; for(const lp of lampPosts){const flicker=1+Math.sin(lampTime*2.2+lp.phase)*0.018+Math.sin(lampTime*7.1+lp.phase)*0.006;if(lp.light)lp.light.intensity=1.15*flicker;lp.halo.scale.setScalar(1+0.025*Math.sin(lampTime+lp.phase));} for(const fb of festoonBulbs){const pulse=1+0.05*Math.sin(lampTime*2.5+fb.phase);fb.bulbMesh.scale.setScalar(pulse);fb.haloMesh.scale.setScalar(pulse);}
      // Рендер
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    
    // Первичный спавн выполняем после полной инициализации сцены, физики и обработчиков.
    // Сразу синхронизируем визуальные меши с телами, чтобы персонаж был на месте уже в первом кадре.
    returnToSpawn();
    for (let i = 0; i < bodies.length; i++) {
      meshes[i].position.copy(bodies[i].position);
      meshes[i].quaternion.copy(bodies[i].quaternion);
    }
    animate();

    // --- Обработка изменения размера ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobileDevice() ? 1.15 : 1.6));
    });

    // Без стартового толчка: персонаж не запускает автоматическое вставание.

    console.log('Симулятор тряпичной куклы готов. Тащите пальцем или мышью.');
  </script>
